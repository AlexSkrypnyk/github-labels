name: Release assets

on:
  workflow_run:
    workflows:
      - Draft release notes
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-assets:
    name: Attach release assets
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Upload script to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName // empty')"
          if [ -z "${TAG}" ]; then
            echo "No draft release to attach the assets to."
            exit 0
          fi
          gh release upload "${TAG}" github-labels.sh --clobber --repo "${GITHUB_REPOSITORY}"
